# Render Blueprint voor Fantasy Manager
# Render-dashboard -> New -> Blueprint -> kies deze repo. Render vraagt dan om de
# waarden met "sync: false" (je ESPN-cookies en de toegangscode).
services:
  - type: web
    name: fantasy-manager
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # free: gratis, maar valt na 15 min zonder bezoek in slaap (wakker worden ~1 min).
    # starter ($7/mnd): altijd aan, live tracking ook als niemand de app open heeft.
    plan: free
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: LEAGUE_ID
        value: "519181463"
      - key: TEAM_ID
        value: "2"
      - key: SEASON
        value: "2026"
      - key: ESPN_S2
        sync: false
      - key: ESPN_SWID
        sync: false
      - key: ACCESS_CODE
        sync: false
      # Nieuws-ETL laadt in Postgres (zie databases hieronder); de app leest met Polars.
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-db
          property: connectionString
    # Optioneel (alleen betaalde plannen): bewaart nieuwsgeschiedenis en data-cache
    # tussen herstarts en deploys.
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1

databases:
  - name: fantasy-db
    databaseName: fantasy
    user: fantasy
    region: frankfurt
    # free: gratis, maar Render verwijdert gratis databases 30 dagen na aanmaak.
    # basic-256mb (~$6/mnd): blijvend. Of gebruik een externe Postgres (bijv. Neon)
    # en zet DATABASE_URL dan handmatig in plaats van fromDatabase.
    plan: free
